<!DOCTYPE html>
<html>
    <head>
        <title>Rock Paper Scissor Game</title>
        <link rel="stylesheet" href="styles/rockpaperscissors.css"> 
    </head>
    <body >
        <p class="game">Rock Paper Scissor Game</p>
    
        <img src="images/rock.jpg" alt="rock" class="rock"
            onclick="play('rock')">
            
        <img src="images/paper.jpg" alt="paper" class="paper"
            onclick="play('paper')">
        <img src="images/scissors.webp" alt="scissors" class="scissors"
            onclick="play('scissor')">
        <p id="result"></p> 
        <p id="score">Wins:0,Losses:0,Ties:0;</p>
          <button class="reset" onclick="resetScore()">Reset Score</button> 
         <script src="scripts/rock-paper-scissors.js"></script>
    </body>
</html>
